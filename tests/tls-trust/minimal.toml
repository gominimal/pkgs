  "ca-certificates", "curl", "openssl", "jdk-27",
]
bash = "bash ./run.sh --mode live --profile '%{profile}' --rows '^(java|java-blocklist)$' --only '%{only}' --jobs '%{jobs}' --timeout '%{timeout}' --details '%{details}' --json -"

