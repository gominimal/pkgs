name: Setup Minimal
description: Install Minimal, configure caches, and prepare the environment

runs:
  using: composite
  steps:
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
    - name: Install Minimal
      if: steps.cache-minimal.outputs.cache-hit != 'true'
      shell: bash
      run: curl --proto '=https' --tlsv1.2 -sSf https://storage.googleapis.com/minimal-shim/install.sh | sh -s -- -y
    - name: Add Minimal to PATH
      shell: bash
      run: |
        # Support both old and new shim layout
        echo "$HOME/.minimal/shim/bin" >> $GITHUB_PATH
        echo "$HOME/.minimal/bin" >> $GITHUB_PATH
    - name: Cache Cargo state
      uses: actions/cache@v5
      with:
        path: ~/.cache/minimal/state
        key: minimal-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: minimal-cargo-
    - name: Cache VCS checkouts
      id: cache-vcs
      uses: actions/cache@v5
      with:
        path: ~/.cache/minimal/vcs
        key: minimal-vcs-${{ runner.os }}
        restore-keys: minimal-vcs-
    - name: Enable unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Route package-cache reads through the R2 mirror
      shell: bash
      # Same move as webapp#380: CI runs on GitHub-hosted Azure runners, so
      # cache reads from GCS are billed internet egress; cache.minimal.farm
      # serves the identical immutable, sha256-verified artifacts from R2 at
      # $0 egress. Measured before this change: the six advisory workflows
      # cold-pull ~6.5 GB per fresh runner, ~370 GB/week across the fleet —
      # the majority of remaining GCS egress spend. Written to $GITHUB_ENV so
      # it reaches the calling job's later steps. Trailing slash required
      # (Url::join). Rollback = delete this step.
      run: echo "MINIMAL_REMOTE_CACHE_URL=https://cache.minimal.farm/" >> "$GITHUB_ENV"
