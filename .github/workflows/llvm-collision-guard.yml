name: llvm-collision-guard

# BLOCKING. No package or stack closure may hold two UNPREFIXED LLVM
# providers: `llvm` and `llvm-bootstrap` both install into /usr, and closure
# members are hardlinked with a path in two members resolved silently (lowest
# spec hash wins). Versioned lines (`llvm-22`, `llvm-23`) must stay under
# /usr/lib/llvm-<N>; prefixed + unprefixed in one closure is allowed.
# Evaluates the whole catalog on both arches. Rationale lives in
# .github/scripts/llvm_collision_guard.py; the shape mirrors
# ruby-flavor-guard.yml.
#
# A dump failure fails too (exit 2 = UNVERIFIED): a guard that cannot see the
# catalog must not go green.

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "stacks/**"
      - ".github/scripts/llvm_collision_guard.py"
      - ".github/scripts/test_llvm_collision_guard.py"
      - ".github/workflows/llvm-collision-guard.yml"

permissions:
  contents: read

concurrency:
  group: llvm-collision-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Guard unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_llvm_collision_guard.py' -v

      # The runner's pinned, sha256-verified evaluator, as node-runtime-guard uses.
      - uses: ./.github/actions/setup-mip

      - name: Dump catalog (amd64 + arm64)
        run: |
          set -euo pipefail
          mip --version || true
          for arch in amd64 arm64; do
            mip dump -p --format json --arch "$arch" > "dump-$arch.json"
            echo "dumped $(jq 'length' "dump-$arch.json") packages ($arch)"
          done

      - name: llvm-collision guard
        run: python3 .github/scripts/llvm_collision_guard.py dump-amd64.json dump-arm64.json
