name: ruby-flavor-guard

# BLOCKING. No package or stack closure may hold two Ruby lines
# (gominimal/pkgs#992): `ruby`, `ruby-3.3` and `ruby-3.4` install the same
# paths, and closure members are hardlinked first-writer-wins per file, so two
# lines blend into one broken interpreter. Evaluates the whole catalog on both
# arches and rejects (1) packages on a versioned line instead of `ruby`,
# (2) runtime or build closures holding more than one line. Rationale and
# escape hatch live in .github/scripts/ruby_flavor_guard.py; the shape mirrors
# node-runtime-guard.yml.
#
# A dump failure fails too (exit 2 = UNVERIFIED): a guard that cannot see the
# catalog must not go green.

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "stacks/**"
      - ".github/scripts/ruby_flavor_guard.py"
      - ".github/scripts/test_ruby_flavor_guard.py"
      - ".github/workflows/ruby-flavor-guard.yml"

permissions:
  contents: read

concurrency:
  group: ruby-flavor-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Guard unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_ruby_flavor_guard.py' -v

      # The runner's pinned, sha256-verified evaluator, as node-runtime-guard uses.
      - uses: ./.github/actions/setup-mip

      - name: Dump catalog (amd64 + arm64)
        run: |
          set -euo pipefail
          mip --version || true
          for arch in amd64 arm64; do
            mip dump -p --format json --arch "$arch" > "dump-$arch.json"
            echo "dumped $(jq 'length' "dump-$arch.json") packages ($arch)"
          done

      - name: ruby-flavor guard
        run: python3 .github/scripts/ruby_flavor_guard.py dump-amd64.json dump-arm64.json
