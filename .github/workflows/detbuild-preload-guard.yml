name: detbuild-preload-guard

# BLOCKING. libdetbuild (packages/detbuild) makes a build's entropy
# predictable, so it may only be preloaded on one build command, never
# exported, and in a build that has the network (its own needs.internet or
# any in its build closure) only on an offline cargo step.
# Rationale in .github/scripts/detbuild_preload_guard.py.

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "stacks/**"
      - ".github/scripts/detbuild_preload_guard.py"
      - ".github/scripts/test_detbuild_preload_guard.py"
      - ".github/workflows/detbuild-preload-guard.yml"

permissions:
  contents: read

concurrency:
  group: detbuild-preload-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: the guard's own tests (it must reject, not just pass)
        run: python3 -m unittest discover -s .github/scripts -p 'test_detbuild_preload_guard.py' -v

      # The guard needs the package graph: a build gets the network when any
      # package in its build closure declares needs.internet, which only the
      # evaluator can resolve. The runner's pinned, sha256-verified evaluator,
      # as in node-runtime-guard. A dump failure fails the job.
      - uses: ./.github/actions/setup-mip

      - name: Dump catalog (amd64 + arm64)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mip dump -p --format json --arch "$arch" > "$RUNNER_TEMP/dump-$arch.json"
          done

      - name: libdetbuild preloads are scoped to one offline command
        run: |
          python3 .github/scripts/detbuild_preload_guard.py \
            --dump "$RUNNER_TEMP/dump-amd64.json" --dump "$RUNNER_TEMP/dump-arm64.json" .
