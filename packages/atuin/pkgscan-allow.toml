# pkgscan triage for atuin (see pkgmgr-rs src/pkgscan/repo_allowlist.rs).
# Each entry is pinned to the whole file's sha256: any change to the file makes
# the finding gate again. A match regrades (Critical -> Medium), never hides.

# atuin 18.24.2 added a managed daemon service with launchd/systemd/subprocess
# backends (atuinsh/atuin#4488, maintainer-authored). These are its
# service-management calls: `launchctl kickstart -k` / `bootout` on the launchd
# job that runs the atuin daemon (atuin's own agent, or an external one such as
# `brew services`), and the restart hint shown to the user. macOS-only code: on
# Linux the `unsupported.rs` backend is compiled instead.
[[allow]]
file = "crates/atuin-daemon/src/service/run_mode.rs"
category = "FileSystemAccess"
pattern = "launchctl"
sha256 = "9372ecfe11895106d06381edfb183b95ae583a24618e91e3d84e0c2c82c27943"
reason = "atuin's daemon restart hint, text shown to the user (not an exec) when the daemon is run by an EXTERNAL launchd job such as `brew services` or a nix home-manager agent: `launchctl kickstart -k gui/$(id -u)/<that job's label>`. Added with the managed daemon service in https://github.com/atuinsh/atuin/pull/4488. Verified against the v18.24.2 tag."

[[allow]]
file = "crates/atuin-daemon/src/service/backend/launchd/macos.rs"
category = "FileSystemAccess"
pattern = "launchctl"
sha256 = "b4d51b454cdc756e41ea2614196f093ee763be1ff6e107ffa91fb17fb421606e"
reason = "atuin's launchd backend (https://github.com/atuinsh/atuin/pull/4488): `launchctl kickstart -k` to restart the launchd job that runs the atuin daemon (its own agent, or an external job running the same atuin executable), `launchctl bootout` and removing its own plist when it leaves. macOS-only module; Linux builds compile launchd/unsupported.rs. Verified against the v18.24.2 tag."

# atuin 18.24.7-8 added a plugin for the Hermes AI agent (maintainer-authored:
# atuinsh/atuin#4689, #4701, #4718). `atuin hook install hermes` writes this file
# into $HERMES_HOME/plugins/atuin/ so Hermes's shell commands land in atuin's
# history. Its one subprocess runs atuin's own binary.
[[allow]]
file = "crates/atuin-common/res/harnesstools/hermes/__init__.py"
category = "ProcessSpawn"
pattern = "subprocess.Popen("
sha256 = "236e7eda83b3e1dd64605e49fd66d82f5f6f8e7a18937f16c0e0b9798f240960"
reason = "atuin's Hermes Agent plugin (https://github.com/atuinsh/atuin/pull/4689, #4701, #4718; maintainer Michelle Tilley). The Popen at line 149 runs `[ATUIN, \"hook\", \"hermes\"]`, atuin's own binary (an absolute path written at install), as an argument list with no shell. It passes the hook event as JSON on stdin, sends stdout/stderr to DEVNULL, has a timeout, and passes os.environ plus atuin's own config paths. The file has no network, encoding or eval use; its only file read is the session file the user names in `hermes atuin import <file>`. Verified against the v18.24.8 tag."
