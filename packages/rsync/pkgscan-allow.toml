# pkgscan triage for rsync (see pkgmgr-rs src/pkgscan/repo_allowlist.rs).
# Each entry is pinned to the whole file's sha256: any change to the file makes
# the finding gate again. A match regrades (High -> Info), never hides.

# configure.sh is generated by autoconf and ships only in the release tarball,
# so it is the place a tarball-only payload would hide (the xz-utils pattern).
# The flagged line is not shell eval: it is the C++ function template
# `template <typename Ret, typename Fn> Ret eval(Fn f, Ret v)` inside autoconf
# 2.72's stock C++11 test program (_AC_CXX_CXX11_TEST_PROGRAM).
[[allow]]
file = "configure.sh"
category = "CodeExecution"
pattern = "eval("
sha256 = "5619489284eb125cd1d77ad79860f80f0b902856f848baf749a6c34c96b7253b"
reason = "rsync 3.5.2. The match is autoconf 2.72's C++11 test program (`Ret eval(Fn f, Ret v)`), not shell eval. Tarball checked 2026-11-04: byte-identical to https://download.samba.org/pub/rsync/src/rsync-3.5.2.tar.gz (sha256 a10d5918...); every git-tracked file equals tag v3.5.2; the configure.sh diff from 3.5.1 is an autoconf 2.73 -> 2.72 regeneration plus five configure.ac checks (wchar.h, linux/ioprio.h, sys/syscall.h, mbrtowc, setpriority) that config.h.in mirrors exactly; payload-marker scan identical to 3.5.1. Release signature not verified (no gpg; the signer is a new maintainer, steadytao)."
