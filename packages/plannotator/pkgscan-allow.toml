# pkgscan triage for plannotator (see pkgmgr-rs src/pkgscan/repo_allowlist.rs).
# Each entry is pinned to the whole file's sha256: any change to the file makes
# the finding gate again. A match regrades (Critical -> Medium, High -> Info),
# never hides.
#
# Triaged for the 0.27.16 -> 0.28.44 bot update (aborted 2026-11-02T17:13Z,
# Critical CredentialAccess). Hashes verified against the v0.28.44, v0.28.45
# and v0.28.46 tags, where all 11 files are byte-identical, and a production
# `pkgscan diff 0.27.16 -> 0.28.46` reports the same 30 findings as -> 0.28.44.
#
# Two kinds of entry:
#  (a) ACCEPTED REAL CAPABILITY, not a false positive: the shipped binary reads
#      ~/.npmrc at runtime (package-changes-service.ts, package-metadata.ts).
#  (b) False positives: JSDoc comments, security tests that write decoy
#      credentials into a temp HOME, and the VS Code extension, which build.sh
#      does not compile (it compiles only apps/hook/server/index.ts).

# --- (a) Accepted real capability -------------------------------------------

[[allow]]
file = "packages/shared/package-changes-service.ts"
category = "CredentialAccess"
pattern = ".npmrc"
sha256 = "74e1fa9efde4b79a9d31088e1f758853be2372da69339f99a566bf93aeff64b2"
reason = "ACCEPTED REAL CAPABILITY, not a false positive. Shipped code (reached from apps/hook/server/index.ts via packages/server/review.ts) reads ~/.npmrc (or $npm_config_userconfig, line 160), npm's global npmrc and the reviewed repo's .npmrc (line 138) at runtime, by default, whenever a reviewed diff has package.json/lockfile changes; opt out with PLANNOTATOR_PACKAGE_LOOKUP=0. Only `registry=` lines are parsed, `_authToken` is ignored, and the result is used only to decide which package names to WITHHOLD from the opt-in registry.npmjs.org lookup; nothing read leaves the machine. Line 16 is a JSDoc comment. Accepted by the recipe maintainer (Bryan) as intended behaviour of a code-review tool. Added in https://github.com/backnotprop/plannotator/commit/c0010c83c4c60563797f2247066d704a7b020be9"

[[allow]]
file = "packages/shared/package-metadata.ts"
category = "CredentialAccess"
pattern = ".npmrc"
sha256 = "c29f4e2f5aa2f724a491c8c50afd8ac767bda48ccb89b50de6df3dbdf5ea2f83"
reason = "ACCEPTED REAL CAPABILITY, not a false positive. Line 257 parses the .npmrc text package-changes-service.ts read at runtime: readNpmrc() keeps only `registry=` / `@scope:registry=` lines (an `_authToken` line never matches) and marks scopes or the default registry private when they point anywhere but registry.npmjs.org/registry.yarnpkg.com, so those names are withheld from the npm lookup. The read happens by default (opt out with PLANNOTATOR_PACKAGE_LOOKUP=0); the registry.npmjs.org lookup itself is opt-in (config.json packageChanges.lookup, default false). Accepted by the recipe maintainer (Bryan) as intended behaviour of a code-review tool. Added in https://github.com/backnotprop/plannotator/commit/c0010c83c4c60563797f2247066d704a7b020be9"

# --- (b) False positives: comments ------------------------------------------

[[allow]]
file = "packages/shared/doc-resolve.ts"
category = "CredentialAccess"
pattern = ".ssh/id_"
sha256 = "3d27b4bb1f6030e41d01d384c17b32dd59ad3800c23b2e823f839e98512efe43"
reason = "False positive: line 172 is inside a JSDoc comment on isDocServeAllowed() describing the attack it REFUSES (`key.md -> ~/.ssh/id_ed25519` is not served). pkgscan strips /* */ comments only in C-family files. Comment added in https://github.com/backnotprop/plannotator/commit/311b2835f413b6c5cf3815c7db88f6a1946fbe1a (#2291)"

[[allow]]
file = "apps/vscode-extension/src/guides/safe-path.ts"
category = "CredentialAccess"
pattern = ".aws/credentials"
sha256 = "036d09bf7d65555681670141d73ed6076fd4d8f3ed242f7c984624db65ce04f5"
reason = "False positive: lines 4 and 36 are JSDoc comments naming the symlink attack (`notes.md -> ~/.aws/credentials`) that realFileInside() refuses to follow out of the repository. Part of the VS Code extension, which build.sh never compiles (only apps/hook/server/index.ts is bundled), so not shipped. Added in https://github.com/backnotprop/plannotator/commit/16c8ee211c9b2d7340da1ea8311b98acb7cd9420"

